<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правила Kami | yufu.su</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: лист документа на сером фоне. Шапка, липкая панель вкладок и поиска, слева оглавление разделов, справа реестр пунктов в виде строк "номер | текст | действие". */
:root {
  --desk: #dcdfe3;
  --paper: #f3f4f6;
  --ink: #1e2227;
  --ink-2: #474d55;
  --ink-3: #636a73;
  --rule: #c7cbd1;
  --rule-strong: #959ca5;
  --tint: #e6e8eb;
  --inv-bg: #2a2f35;
  --inv-fg: #f3f4f6;
  --accent: #8a5a2b;
  --accent-bg: #f0e6da;
  --note: #3f6b4f;
  --warn: #8a4a2b;
  --serif: "IBM Plex Serif", "PT Serif", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "PT Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --idw: 6.5rem;
  --bar-h: 5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121417;
    --paper: #1c2024;
    --ink: #e5e7ea;
    --ink-2: #b6bbc1;
    --ink-3: #8d939a;
    --rule: #32383e;
    --rule-strong: #565d65;
    --tint: #262b30;
    --inv-bg: #e5e7ea;
    --inv-fg: #181b1f;
    --accent: #d6a56a;
    --accent-bg: #2e2620;
    --note: #8fc9a4;
    --warn: #e0a183;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121417;
  --paper: #1c2024;
  --ink: #e5e7ea;
  --ink-2: #b6bbc1;
  --ink-3: #8d939a;
  --rule: #32383e;
  --rule-strong: #565d65;
  --tint: #262b30;
  --inv-bg: #e5e7ea;
  --inv-fg: #181b1f;
  --accent: #d6a56a;
  --accent-bg: #2e2620;
  --note: #8fc9a4;
  --warn: #e0a183;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font: 400 1rem/1.65 var(--sans);
  padding-block: 1.5rem 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--paper);
  z-index: 10;
}

button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.sheet {
  max-width: 100rem; /* Увеличено для широких экранов (было 74rem) */
  margin: 0 auto;
  background: var(--paper);
  border: 1px solid var(--rule-strong);
}

/* Шапка документа */
.mast {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding: 2rem 2.5rem 1.5rem;
}
.org {
  margin: 0 0 0.35rem;
  font: 500 0.75rem/1.2 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1 {
  margin: 0;
  font: 600 2rem/1.2 var(--serif);
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.facts {
  margin: 0;
  font: 400 0.8125rem/1.4 var(--mono);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* Липкая панель: вкладки и поиск */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem 1.5rem;
  padding: 0.75rem 2.5rem;
  background: var(--paper);
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule-strong);
}
.tabs { display: flex; gap: 0; }
.tab {
  display: inline-flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.55rem 1.25rem;
  background: transparent;
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  cursor: pointer;
  font-weight: 500;
  color: var(--ink-2);
}
.tab + .tab { border-left: 0; }
.tab:hover { background: var(--tint); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-fg); }
.tab .n { font: 400 0.75rem/1 var(--mono); font-variant-numeric: tabular-nums; opacity: 0.8; }

.search { flex: 1 1 20rem; max-width: 32rem; margin-left: auto; min-width: 0; }
.search input {
  width: 100%;
  padding: 0.55rem 0.75rem;
  background: var(--paper);
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  color: var(--ink);
}
.search input::placeholder { color: var(--ink-3); opacity: 1; }
.search input:focus-visible { outline-offset: 0; }

/* Тело */
.layout {
  display: grid;
  grid-template-columns: 17rem minmax(0, 1fr);
  gap: 0 3rem;
  padding: 2rem 2.5rem;
  align-items: start;
}
.side {
  position: sticky;
  top: calc(var(--bar-h) + 1.5rem + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - var(--bar-h) - 3rem);
  overflow-y: auto;
  min-width: 0;
}
.side h2 {
  margin: 0 0 0.75rem;
  font: 500 0.6875rem/1.2 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.nav { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.nav a {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.5rem 0.75rem;
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
  font-size: 0.9375rem;
  line-height: 1.4;
}
.nav a:hover { background: var(--tint); color: var(--ink); }
.nav a[aria-current="true"] { background: var(--tint); color: var(--ink); font-weight: 600; }
.nav .c { font: 400 0.75rem/1 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
.nav li.off a { opacity: 0.45; pointer-events: none; }

.main { min-width: 0; }
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding-bottom: 1rem;
  margin-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
  font-size: 0.9375rem;
  color: var(--ink-2);
}
.status { margin: 0; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
.check input { width: 1rem; height: 1rem; margin: 0; accent-color: var(--inv-bg); }

.sec { scroll-margin-top: calc(var(--bar-h) + 1.5rem); padding-top: 1.5rem; }
.sec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--ink);
}
.sec-head .no { font: 500 0.75rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sec-head h3 { margin: 0; font: 600 1.5rem/1.3 var(--serif); text-wrap: balance; }
.sec-head .cnt { margin-left: auto; font: 400 0.8125rem/1 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Пункт */
.row {
  display: grid;
  grid-template-columns: var(--idw) minmax(0, 1fr) auto;
  grid-template-areas: "id body act";
  gap: 0 1.5rem;
  padding: 1.25rem 0;
  border-bottom: 1px solid var(--rule);
}
/* Спец-класс для слитных пунктов (без номера) */
.row.prose {
  display: block;
  padding: 1rem 0;
}
.row.prose .id, .row.prose .act { display: none; }
.row.prose .body { max-width: 100%; }
.row.prose .txt { margin-bottom: 0.5rem; }
.row.prose .txt:last-child { margin-bottom: 0; }

.id {
  grid-area: id;
  font: 500 0.8125rem/1.5 var(--mono);
  color: var(--ink-3);
  overflow-wrap: anywhere;
}
.id:not(:empty) {
  background: var(--tint);
  align-self: start;
  padding: 0.2rem 0.5rem;
  border-radius: 3px;
  text-align: center;
}
.body { grid-area: body; min-width: 0; }
.act { grid-area: act; align-self: start; }
.full { margin: 0 0 0.25rem; font: 400 0.875rem/1.5 var(--mono); color: var(--ink-3); }
.txt { margin: 0; max-width: 90ch; overflow-wrap: anywhere; font-size: 1.0625rem; line-height: 1.65; }

/* Метаданные: строки с меткой, без таблицы */
.meta {
  margin: 1rem 0 0;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  max-width: 90ch;
}
.meta > div {
  display: grid;
  grid-template-columns: 8rem minmax(0, 1fr);
  gap: 0 1rem;
  padding: 0.25rem 0;
  font-size: 0.9375rem;
}
.meta dt {
  font: 500 0.6875rem/1.9 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-top: 0.1rem;
}
.meta dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.meta > div[data-kind="note"] dt { color: var(--note); }
.meta > div[data-kind="warn"] dt { color: var(--warn); }

/* Блок санкции */
.sanction {
  margin: 1rem 0 0;
  max-width: 90ch;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.65rem 1rem 0.75rem;
  background: var(--accent-bg);
  border-left: 4px solid var(--accent);
  border-radius: 0 4px 4px 0;
  transition: background 0.15s ease;
}
.row:hover .sanction { background: color-mix(in srgb, var(--accent-bg) 80%, var(--accent) 20%); }
.sanction-label {
  font: 500 0.6875rem/1.2 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.9;
}
.sanction-value {
  font: 500 0.9375rem/1.5 var(--sans);
  color: var(--ink);
  letter-spacing: 0.01em;
}
.sanction-value span { display: block; }

/* Кнопка копирования */
.copy {
  padding: 0.2rem 0.5rem;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  font: 500 0.6875rem/1.4 var(--mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.copy:hover { color: var(--ink); border-color: var(--rule-strong); }
@media (hover: hover) {
  .copy { opacity: 0; }
  .row:hover .copy, .row:focus-within .copy { opacity: 1; }
}

mark { background: var(--inv-bg); color: var(--inv-fg); padding: 0 0.12em; }

.empty { padding: 3rem 0; max-width: 50ch; }
.empty p { margin: 0 0 0.75rem; }
.linkbtn {
  padding: 0.5rem 1rem;
  background: transparent;
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  cursor: pointer;
  color: var(--ink);
}
.linkbtn:hover { background: var(--tint); }

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.35rem 1.5rem;
  padding: 1.5rem 2.5rem;
  border-top: 1px solid var(--rule-strong);
  font: 400 0.75rem/1.5 var(--mono);
  color: var(--ink-3);
}
kbd { font: inherit; padding: 0 0.3em; border: 1px solid var(--rule-strong); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 860px) {
  body { padding-block: 0 1.5rem; }
  .sheet { border-left: 0; border-right: 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
  .mast, .bar, .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .layout { grid-template-columns: minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 1.5rem; }
  .side { position: static; max-height: none; overflow: visible; margin-bottom: 1rem; }
  .side h2 { display: none; }
  .nav { flex-direction: row; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem; }
  .nav li { flex: none; }
  .nav a { border: 1px solid var(--rule-strong); white-space: nowrap; padding: 0.4rem 0.7rem; }
  .nav a[aria-current="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
  .tabs { width: 100%; }
  .tab { flex: 1 1 0; justify-content: center; flex-wrap: wrap; gap: 0.15rem 0.5rem; padding: 0.55rem 0.5rem; text-align: center; }
  .search { max-width: none; flex-basis: 100%; margin-left: 0; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id act" "body body"; gap: 0.3rem 1rem; padding: 1rem 0; }
  .id { justify-self: start; }
  .row.noid { grid-template-areas: "body body"; }
  .row.noid .id, .row.noid .act { display: none; }
  .meta > div { grid-template-columns: 1fr; gap: 0.1rem; }
  .meta dt { padding-top: 0; }
  .copy { opacity: 1 !important; }
  h1 { font-size: 1.75rem; }
}
</style>
</head>
<body>

<div class="sheet">
  <header class="mast">
    <div>
      <p class="org">Kami | yufu.su</p>
      <h1 id="h1">Правила проекта</h1>
    </div>
    <p class="facts" id="facts"></p>
  </header>

  <div class="bar" id="bar">
    <div class="tabs" role="tablist" aria-label="Документы">
      <button class="tab" role="tab" id="tab-project" aria-controls="panel" data-tab="project" type="button">Правила проекта <span class="n" data-count="project"></span></button>
      <button class="tab" role="tab" id="tab-admin" aria-controls="panel" data-tab="admin" type="button">Правила администрации <span class="n" data-count="admin"></span></button>
    </div>
    <div class="search">
      <label class="sr" for="q">Поиск по документу</label>
      <input id="q" type="search" placeholder="Поиск по пунктам, терминам и санкциям" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="layout">
    <aside class="side" aria-label="Разделы">
      <h2>Разделы</h2>
      <ul class="nav" id="nav"></ul>
    </aside>
    <main class="main" id="panel" role="tabpanel" tabindex="-1">
      <div class="tools">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <label class="check"><input type="checkbox" id="only"><span id="onlyLabel">Только пункты с санкцией</span></label>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <footer class="foot">
    <span>Документ является собственностью проекта Kami | yufu.su</span>
    <span>Поиск: клавиша <kbd>/</kbd>. Сброс запроса: <kbd>Esc</kbd></span>
  </footer>
</div>

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  /* Индекс для поиска */
  ORDER.forEach(function (k) {
    DOCS[k].sections.forEach(function (sec) {
      sec.items.forEach(function (it) {
        it.idx = norm([it.i, it.full, it.t, it.n, it.p, it.x, it.e, arr(it.s).join(" ")].filter(Boolean).join(" "));
      });
    });
  });

  var state = { tab: "project", q: "", words: [], only: false };

  function matches(it) {
    if (state.only && !it.s) return false;
    for (var i = 0; i < state.words.length; i++) {
      if (it.idx.indexOf(state.words[i]) === -1) return false;
    }
    return true;
  }

  function hl(text) {
    if (!state.words.length) return esc(text);
    var n = norm(text), ranges = [];
    state.words.forEach(function (w) {
      var pos = 0, at;
      while ((at = n.indexOf(w, pos)) > -1) { ranges.push([at, at + w.length]); pos = at + w.length; }
    });
    if (!ranges.length) return esc(text);
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var last = merged[merged.length - 1];
      if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
      else merged.push(ranges[i]);
    }
    var out = "", p = 0;
    merged.forEach(function (r) {
      out += esc(text.slice(p, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>";
      p = r[1];
    });
    return out + esc(text.slice(p));
  }

  function countDoc(k) {
    var shown = 0, total = 0;
    DOCS[k].sections.forEach(function (sec) {
      sec.items.forEach(function (it) { total++; if (matches(it)) shown++; });
    });
    return { shown: shown, total: total };
  }

  /* ---------- Отрисовка ---------- */

  function metaRow(label, value, kind) {
    return '<div' + (kind ? ' data-kind="' + kind + '"' : "") + "><dt>" + esc(label) + "</dt><dd>" + value + "</dd></div>";
  }

  function rowHtml(it, doc, secKey, idx) {
    var rid = it.i || "";
    var meta = "";
    if (it.p) meta += metaRow("Пояснение", hl(it.p), "plain");
    if (it.n) meta += metaRow("Примечание", hl(it.n), "note");
    if (it.x) meta += metaRow("Пример", hl(it.x), "warn");
    if (it.e) meta += metaRow("Исключение", hl(it.e), "warn");

    var sanction = "";
    if (it.s) {
      sanction = '<div class="sanction">' +
        '<span class="sanction-label">' + esc(doc.sLabel) + '</span>' +
        '<div class="sanction-value">' +
          arr(it.s).map(function (v) { return "<span>" + hl(v) + "</span>"; }).join("") +
        '</div></div>';
    }

    var isProse = !rid;
    var rowClass = "row" + (isProse ? " prose" : "");

    return '<article class="' + rowClass + '">' +
      '<div class="id">' + (rid ? hl(rid) : "") + "</div>" +
      '<div class="body">' +
        (it.full ? '<p class="full">' + hl(it.full) + "</p>" : "") +
        '<p class="txt">' + hl(it.t) + "</p>" +
        (meta ? '<dl class="meta">' + meta + "</dl>" : "") +
        sanction +
      "</div>" +
      '<div class="act"><button class="copy" type="button" data-sec="' + secKey + '" data-idx="' + idx + '" aria-label="Копировать пункт ' + esc(rid || "") + '">Копировать</button></div>' +
    "</article>";
  }

  function render() {
    var key = state.tab, doc = DOCS[key];
    var navHtml = "", html = "", shown = 0, total = 0;

    doc.sections.forEach(function (sec) {
      var list = [];
      sec.items.forEach(function (it, idx) {
        total++;
        if (matches(it)) { list.push([it, idx]); shown++; }
      });
      var sid = key + "-" + sec.id;
      navHtml += '<li class="' + (list.length ? "" : "off") + '"><a href="#' + sid + '" data-sec="' + sid + '">' +
        "<span>" + esc(sec.title) + '</span><span class="c">' + list.length + "</span></a></li>";
      if (!list.length) return;
      html += '<section class="sec" id="' + sid + '" aria-labelledby="h-' + sid + '">' +
        '<div class="sec-head">' +
          (sec.num ? '<span class="no">Раздел ' + sec.num + "</span>" : "") +
          '<h3 id="h-' + sid + '">' + esc(sec.title) + "</h3>" +
          '<span class="cnt">' + list.length + " " + plural(list.length, "пункт", "пункта", "пунктов") + "</span>" +
        "</div>" +
        list.map(function (p) { return rowHtml(p[0], doc, sec.id, p[1]); }).join("") +
      "</section>";
    });

    if (!shown) {
      var other = ORDER.filter(function (k) { return k !== key; })[0];
      var oc = countDoc(other);
      html = '<div class="empty"><p>' +
        (state.q ? "По запросу «" + esc(state.q) + "» в этом документе ничего не найдено." : "В этом документе нет пунктов, подходящих под фильтр.") +
        "</p>" +
        (oc.shown ? '<p><button class="linkbtn" type="button" data-goto="' + other + '">Показать совпадения в документе «' + esc(DOCS[other].title) + "» (" + oc.shown + ")</button></p>" : "") +
        (state.q ? '<p><button class="linkbtn" type="button" data-clear="1">Сбросить запрос</button></p>' : "") +
      "</div>";
    }

    document.getElementById("nav").innerHTML = navHtml;
    document.getElementById("content").innerHTML = html;

    var filtered = state.q || state.only;
    document.getElementById("status").textContent = filtered
      ? "Найдено " + shown + " из " + total + " " + plural(total, "пункта", "пунктов", "пунктов")
      : "Всего " + total + " " + plural(total, "пункт", "пункта", "пунктов");
    document.getElementById("onlyLabel").textContent = doc.onlyLabel;
    document.getElementById("only").checked = state.only;
    document.getElementById("h1").textContent = doc.title;
    document.getElementById("facts").textContent =
      doc.sections.length + " " + plural(doc.sections.length, "раздел", "раздела", "разделов") + " / " +
      total + " " + plural(total, "пункт", "пункта", "пунктов");

    ORDER.forEach(function (k) {
      var c = countDoc(k);
      document.querySelector('[data-count="' + k + '"]').textContent = filtered ? c.shown + "/" + c.total : String(c.total);
      var t = document.getElementById("tab-" + k);
      t.setAttribute("aria-selected", k === key ? "true" : "false");
      t.tabIndex = k === key ? 0 : -1;
    });
    document.getElementById("panel").setAttribute("aria-labelledby", "tab-" + key);
    document.title = doc.title + " | Kami yufu.su";
    observe();
  }

  /* ---------- Подсветка текущего раздела ---------- */

  var io = null;
  function observe() {
    if (io) io.disconnect();
    if (!("IntersectionObserver" in window)) return;
    var bar = document.getElementById("bar").offsetHeight || 80;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          var id = e.target.id;
          document.querySelectorAll("#nav a").forEach(function (a) {
            if (a.getAttribute("data-sec") === id) a.setAttribute("aria-current", "true");
            else a.removeAttribute("aria-current");
          });
        }
      });
    }, { rootMargin: "-" + (bar + 24) + "px 0px -65% 0px", threshold: 0 });
    document.querySelectorAll(".sec").forEach(function (s) { io.observe(s); });
  }

  function measure() {
    var h = document.getElementById("bar").offsetHeight;
    if (h) document.documentElement.style.setProperty("--bar-h", h + "px");
  }

  /* ---------- Маршрутизация по hash ---------- */

  function applyHash(fromUser) {
    var h = (location.hash || "").replace(/^#/, "");
    var tab = state.tab, secId = null;
    if (h === "project" || h === "admin") tab = h;
    else if (/^(project|admin)-/.test(h)) { tab = h.split("-")[0]; secId = h; }
    var changed = tab !== state.tab;
    state.tab = tab;
    if (changed) render();
    if (secId) {
      var el = document.getElementById(secId);
      if (el) el.scrollIntoView();
    } else if (changed && fromUser) {
      window.scrollTo(0, 0);
    }
  }

  function setTab(k) {
    if (k === state.tab) return;
    if (location.hash.replace(/^#/, "") === k) { applyHash(true); }
    else location.hash = k;
  }

  /* ---------- Копирование ---------- */

  function itemText(secKey, idx) {
    var doc = DOCS[state.tab], sec = doc.sections.filter(function (s) { return s.id === secKey; })[0];
    var it = sec.items[idx], lines = [];
    lines.push((it.i ? it.i + (it.full ? " (" + it.full + ")" : "") + " " : "") + it.t);
    if (it.p) lines.push("Пояснение: " + it.p);
    if (it.n) lines.push("Примечание: " + it.n);
    if (it.x) lines.push("Пример: " + it.x);
    if (it.e) lines.push("Исключение: " + it.e);
    arr(it.s).forEach(function (v) { lines.push(doc.sLabel + ": " + v); });
    return lines.join("\n");
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function flash(btn, msg) {
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = "Копировать"; }, 1600);
  }

  function copyItem(btn) {
    var text = itemText(btn.getAttribute("data-sec"), +btn.getAttribute("data-idx"));
    var done = function () { flash(btn, "Скопировано"); };
    var fail = function () { flash(btn, fallbackCopy(text) ? "Скопировано" : "Не удалось"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
    } else fail();
  }

  /* ---------- События ---------- */

  var qEl = document.getElementById("q");
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = qEl.value.trim();
      state.words = norm(state.q).split(/\s+/).filter(Boolean);
      render();
    }, 90);
  });
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { qEl.value = ""; state.q = ""; state.words = []; render(); }
  });

  document.getElementById("only").addEventListener("change", function (e) {
    state.only = e.target.checked;
    render();
  });

  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) setTab(b.getAttribute("data-tab"));
  });
  document.querySelector(".tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var i = ORDER.indexOf(state.tab), n = ORDER[(i + (e.key === "ArrowRight" ? 1 : ORDER.length - 1)) % ORDER.length];
    setTab(n);
    document.getElementById("tab-" + n).focus();
    e.preventDefault();
  });

  document.getElementById("content").addEventListener("click", function (e) {
    var c = e.target.closest(".copy");
    if (c) { copyItem(c); return; }
    var g = e.target.closest("[data-goto]");
    if (g) { setTab(g.getAttribute("data-goto")); return; }
    if (e.target.closest("[data-clear]")) {
      qEl.value = ""; state.q = ""; state.words = []; render(); qEl.focus();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var t = e.target, tag = t && t.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
      e.preventDefault();
      qEl.focus();
      qEl.select();
    }
  });

  window.addEventListener("hashchange", function () { applyHash(true); });
  window.addEventListener("resize", measure);
  if ("ResizeObserver" in window) new ResizeObserver(measure).observe(document.getElementById("bar"));

  /* ---------- Запуск ---------- */
  applyHash(false);
  render();
  measure();
  (function () {
    var h = (location.hash || "").replace(/^#/, "");
    if (/^(project|admin)-/.test(h)) {
      var el = document.getElementById(h);
      if (el) el.scrollIntoView();
    }
  })();
})();
</script>
</body>
</html>
